<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>EXOS+ Architecture Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Hapus semua animasi/motion */
            transition: none !important;
            animation: none !important;
        }

        body {
            background-color: #000000;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Inter', system-ui, sans-serif;
            position: relative;
        }

        /* Kontainer gambar full screen */
        .slider-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .slide-img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain; /* full gambar tanpa terpotong, background hitam */
            display: block;
            margin: 0 auto;
        }

        /* Tombol navigasi (Back / Next) — style tegas tanpa gerakan */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(20, 20, 28, 0.85);
            backdrop-filter: blur(0px); /* tidak pakai blur untuk hindari efek gerak, tapi tidak masalah */
            border: 1px solid #3c3c44;
            color: #eee;
            font-size: 1.8rem;
            font-weight: 600;
            padding: 0.6rem 1rem;
            cursor: pointer;
            border-radius: 48px;
            text-decoration: none;
            user-select: none;
            font-family: monospace;
            line-height: 1;
            transition: none;
            z-index: 20;
            min-width: 64px;
            text-align: center;
            letter-spacing: 1px;
        }
        .nav-btn:active {
            background: #2a2a34;
        }
        .nav-prev {
            left: 16px;
        }
        .nav-next {
            right: 16px;
        }

        /* Tombol kembali ke index (Back to main) */
        .back-home {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #1c1c24;
            border: 1px solid #444;
            color: #ccc;
            font-size: 0.8rem;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 500;
            z-index: 20;
            letter-spacing: 0.5px;
            transition: none;
        }
        .back-home:active {
            background: #2a2a32;
        }

        /* Indikator gambar (serius dan kecil) */
        .counter {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.65);
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #bbbbcc;
            font-family: monospace;
            backdrop-filter: blur(0px);
            z-index: 20;
            border: 1px solid #2e2e38;
            letter-spacing: 0.5px;
        }

        /* Untuk touch dan tanpa efek hover gerak */
        a, .nav-btn {
            -webkit-tap-highlight-color: transparent;
        }

        /* Hilangkan scroll, full hitam */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

<div class="slider-container">
    <img id="mainImage" class="slide-img" src="Pic1.jpg" alt="Architecture view">
</div>

<!-- Tombol prev / next -->
<button class="nav-btn nav-prev" id="prevBtn">‹ Back</button>
<button class="nav-btn nav-next" id="nextBtn">Next ›</button>

<!-- Indikator gambar -->
<div class="counter" id="imageCounter">1 / 5</div>

<!-- Tombol kembali ke halaman utama (index.html) -->
<a href="index.html" class="back-home">◀ Return to Main</a>

<script>
    // Daftar gambar (sesuai upload: Pic1.jpg s/d Pic5.jpg)
    const images = [
        "Pic1.jpg",
        "Pic2.jpg",
        "Pic3.jpg",
        "Pic4.jpg",
        "Pic5.jpg"
    ];

    let currentIndex = 0;
    const totalImages = images.length;
    const imgElement = document.getElementById('mainImage');
    const counterElement = document.getElementById('imageCounter');

    function updateImage() {
        // update gambar
        imgElement.src = images[currentIndex];
        counterElement.innerText = `${currentIndex+1} / ${totalImages}`;
    }

    // Event tombol prev
    document.getElementById('prevBtn').addEventListener('click', () => {
        currentIndex = (currentIndex - 1 + totalImages) % totalImages;
        updateImage();
    });

    // Event tombol next
    document.getElementById('nextBtn').addEventListener('click', () => {
        currentIndex = (currentIndex + 1) % totalImages;
        updateImage();
    });

    // Opsional: keyboard arrow left/right (tanpa animasi)
    window.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft') {
            e.preventDefault();
            currentIndex = (currentIndex - 1 + totalImages) % totalImages;
            updateImage();
        } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            currentIndex = (currentIndex + 1) % totalImages;
            updateImage();
        }
    });

    // Inisialisasi
    updateImage();
</script>
</body>
</html>
